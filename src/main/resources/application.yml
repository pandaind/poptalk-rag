server:
  port: 8090

spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/poptalk_rag}
    username: ${DB_USERNAME:poptalk_rag}
    password: ${DB_PASSWORD:poptalk_rag}
  ai:
    mcp:
      server:
        # Must be explicit — unlike most other Spring AI selector properties,
        # this one defaults OFF (confirmed by booting: /mcp 404'd until this
        # was set), not to STREAMABLE.
        protocol: STREAMABLE
        name: poptalk-rag
    vectorstore:
      pgvector:
        initialize-schema: true
        dimensions: ${EMBEDDING_DIMENSIONS:768}
    # poptalk-rag wires its own embedding-provider ChatModel/EmbeddingModel beans
    # (see config/*EmbeddingConfig.java) the same way poptalk-backend wires its
    # chat providers — disable Spring AI's own single-provider auto-selection.
    # The openai starter also brings chat/image/audio/moderation autoconfigs
    # that fail hard at startup without their own key even when unused
    # (same bug class found and fixed in poptalk-backend) — disable all of them.
    model:
      embedding: none
      chat: none
      image: none
      moderation: none
      audio:
        speech: none
        transcription: none
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      embedding:
        model: ${OLLAMA_EMBEDDING_MODEL:nomic-embed-text}
      chat:
        model: ${RERANK_MODEL:llama3.2}
    openai:
      api-key: ${OPENAI_API_KEY:}
      base-url: ${OPENAI_BASE_URL:https://api.openai.com}
      embedding:
        model: ${OPENAI_EMBEDDING_MODEL:text-embedding-3-small}
      chat:
        model: ${RERANK_MODEL:gpt-4o-mini}

app:
  embedding:
    # Which embedding provider to use: ollama (default, free/local) or openai.
    provider: ${EMBEDDING_PROVIDER:ollama}
  rag:
    # Cosine-similarity floor (0.0-1.0) below which a match is dropped
    # entirely, regardless of topK — without this, low-relevance chunks pad
    # out to topK rather than being excluded. Needs tuning per embedding
    # model; 0.5 is a reasonable starting point, not a universal constant.
    similarity-threshold: ${SIMILARITY_THRESHOLD:0.5}
    # Reserved persona id whose documents (knowledge/<this>/) every persona
    # can retrieve, in addition to their own — a way to share common
    # documents across personas without duplicating files.
    shared-persona-id: ${SHARED_PERSONA_ID:_shared}
    # Hard cap on the total characters search_knowledge_base returns,
    # regardless of how topK is configured — keeps a misconfigured client
    # from blowing the calling model's context budget.
    max-context-chars: ${MAX_CONTEXT_CHARS:6000}
  chunking:
    # TokenTextSplitter's own defaults, made explicit and configurable.
    chunk-size: ${CHUNK_SIZE:800}
    min-chunk-size-chars: ${MIN_CHUNK_SIZE_CHARS:350}
    # TokenTextSplitter has no overlap of its own — this many trailing
    # characters of a chunk are prepended to the next one, to reduce context
    # loss at chunk boundaries.
    overlap-chars: ${CHUNK_OVERLAP_CHARS:100}
  search:
    hybrid:
      # Adds a Postgres full-text-search leg alongside vector similarity,
      # merged via Reciprocal Rank Fusion — catches exact-term queries a
      # pure embedding search can miss. Escape hatch back to vector-only if
      # the FTS column/index ever misbehaves.
      enabled: ${HYBRID_SEARCH_ENABLED:true}
  rerank:
    # Re-scores the vector search's candidates with a chat model before
    # returning the requested topK — cosine similarity alone is a fairly
    # blunt relevance signal. Falls back to plain vector-similarity order
    # if disabled, unconfigured, or the rerank call fails (see LlmReranker).
    enabled: ${RERANK_ENABLED:true}
    # ollama (default, free/local) or openai — independent of app.embedding.provider,
    # since reranking needs a chat/instruct model, not an embedding encoder.
    provider: ${RERANK_PROVIDER:ollama}
    # How many candidates to fetch from the vector search before reranking,
    # relative to the requested topK (capped by max-candidate-pool below).
    candidate-pool-multiplier: ${RERANK_CANDIDATE_POOL_MULTIPLIER:4}
    max-candidate-pool: ${RERANK_MAX_CANDIDATE_POOL:20}
  knowledge:
    # Root directory scanned for per-persona knowledge sources:
    # <dir>/<personaId>/*.{md,txt,pdf,docx,html}
    dir: ${KNOWLEDGE_DIR:./knowledge}
    poll-interval-ms: ${KNOWLEDGE_POLL_INTERVAL_MS:60000}
  # personaId:apiKey,personaId2:apiKey2 — the ONLY source of tenant identity.
  # A request's persona is derived from which key authenticated it, never
  # from a client- or model-supplied field.
  persona-api-keys: ${PERSONA_API_KEYS:}

logging:
  level:
    in.pandac.rag: INFO
    org.apache.camel: INFO
