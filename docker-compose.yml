services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: poptalk-rag-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-poptalk_rag}
      POSTGRES_USER: ${DB_USERNAME:-poptalk_rag}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-poptalk_rag}
    ports:
      # Loopback only: the app reaches the database over the compose network, so the host port
      # is just for local tooling and must not be reachable from other machines.
      - "127.0.0.1:${DB_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-poptalk_rag}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: poptalk-rag
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      # Published on every interface so a PopTalk running in another compose project can reach it
      # through host.docker.internal. Requests are guarded by persona API keys; use the combined
      # stack in the PopTalk repo's deploy/ folder (no published port) or a firewall if the host
      # is on a network you do not trust.
      - "${HOST_PORT:-8090}:8090"
    extra_hosts:
      # Lets the container reach an Ollama running on the host. Docker Desktop provides this
      # name; Docker Engine on Linux needs the mapping.
      - "host.docker.internal:host-gateway"
    env_file:
      - .env
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-poptalk_rag}
      DB_USERNAME: ${DB_USERNAME:-poptalk_rag}
      DB_PASSWORD: ${DB_PASSWORD:-poptalk_rag}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-ollama}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-768}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_EMBEDDING_MODEL: ${OLLAMA_EMBEDDING_MODEL:-nomic-embed-text}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}
      PERSONA_API_KEYS: ${PERSONA_API_KEYS:-}
      KNOWLEDGE_DIR: /app/knowledge
      KNOWLEDGE_POLL_INTERVAL_MS: ${KNOWLEDGE_POLL_INTERVAL_MS:-60000}
      KNOWLEDGE_SITE_SOURCES: ${KNOWLEDGE_SITE_SOURCES:-}
      KNOWLEDGE_SITE_POLL_MS: ${KNOWLEDGE_SITE_POLL_MS:-600000}
    volumes:
      - ./knowledge:/app/knowledge
    healthcheck:
      # The app has no health endpoint; an open port means the MCP server is up.
      test: ["CMD-SHELL", "nc -z localhost 8090 || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 15s

volumes:
  pgdata:
